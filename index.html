<!-- 应用外壳：固定在视口上的两行网格 —— 第一行页面（可伸缩、可平移），

     多长、页面怎么平移都无关。这一层结构就是「导航跑到上面去」的根。 -->
<div id="app">
  <div class="pager" id="pager">

  </div>

  <nav class="tabbar glass" role="tablist" aria-label="主导航">

    <button class="tab" data-nav="now" role="tab"><svg class="ic"><use href="#i-now"/></svg><span>此刻</span></button>

    <button class="tab" data-nav="me" role="tab"><svg class="ic"><use href="#i-me"/></svg><span>我的</span></button>
  </nav>
</div>
